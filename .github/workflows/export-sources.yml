name: Export actual HazardGuard v3.2 sources for maintenance
on:
  push:
    branches: [cozy-gdacs-emergency-2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect deployed overlay sources
        run: |
          mkdir -p current-release
          unzip -oq HazardGuard_World_v3_2_Event_Details_Update.zip -d current-release
          find current-release -maxdepth 7 -type f | head -100
      - uses: actions/upload-artifact@v4
        with:
          name: hazard-current-release-sources
          path: current-release/
          if-no-files-found: error
