name: Materialize current World v3.2 source on update branch
on:
  workflow_dispatch:
  push:
    branches: [cozy-gdacs-emergency-2026]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Bring current v3.2 source into version control
        run: |
          unzip -oq HazardGuard_World_v3_2_Event_Details_Update.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md app-icon-1024.png tools
          if ! git diff --cached --quiet; then
            git commit -m "Track actual World v3.2 Android sources for safe upgrades"
            git push origin HEAD:cozy-gdacs-emergency-2026
          fi
