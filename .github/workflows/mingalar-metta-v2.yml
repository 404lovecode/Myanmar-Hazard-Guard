name: Build Mingalar Metta v2 · Real Offline Chanting
on:
  push:
    branches: [mingalar-metta-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Remove previous Android wrapper
        run: rm -rf gradle/wrapper
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract v2 Android source
        run: unzip -q Mingalar-Metta-v2-source.zip
      - name: Verify comprehensive Dhamma library
        run: python3 mingalar-metta/tools/validate_content.py
      - name: Fetch CC0 offline real Three Refuges recording
        run: python3 mingalar-metta/tools/fetch_audio.py
      - name: Verify bundled chanting actually decodes
        run: |
          AUDIO=mingalar-metta/app/src/main/res/raw/refuge_chant.ogg
          test -s "$AUDIO"
          file "$AUDIO"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mingalar-metta/app/src/main/res/raw/refuge_chant.ogg')
          assert p.read_bytes()[:4]==b'OggS'
          assert p.stat().st_size>1000000
          print("Real CC0 voice recording included; bytes:",p.stat().st_size)
          PY
      - name: Compile Android APK
        working-directory: mingalar-metta
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify signed APK package and bundled audio
        run: |
          APK=mingalar-metta/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -10
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -l "$APK" | grep refuge_chant
      - uses: actions/upload-artifact@v4
        with:
          name: Mingalar-Metta-v2-APK
          path: mingalar-metta/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
