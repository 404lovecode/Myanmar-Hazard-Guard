name: Build HazardGuard World APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply v3 update
        run: unzip -o HazardGuard_World_v3_Update.zip -d .

      - name: Build installable APK
        run: bash gradlew --no-daemon assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: HazardGuard-World-v3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
