name: Build HazardGuard v4 APK
on:
  push:
    branches: [main, cozy-gdacs-emergency-2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Remove older custom wrapper
        run: rm -rf gradle/wrapper
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test emergency contact mapping
        run: |
          mkdir -p /tmp/hazard-tests
          javac -d /tmp/hazard-tests app/src/main/java/mm/hazardguard/EmergencyContacts.java tools/EmergencyContactsSelfTest.java
          java -cp /tmp/hazard-tests EmergencyContactsSelfTest
      - name: Build APK from checked-in sources
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Myanmar-Hazard-Guard-v4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
