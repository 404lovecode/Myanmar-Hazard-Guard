name: Build HazardGuard World APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply v3 update
        run: unzip -o HazardGuard_World_v3_Internet_Fix.zip -d .

      - name: Fix duplicate Burmese translation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file = Path('app/src/main/res/values-my/strings.xml')
          data = file.read_text(encoding='utf-8')
          entry = '<string name="choose_location">'
          if data.count(entry) > 1:
              start = data.index(entry)
              end = data.index('</string>', start) + len('</string>')
              data = data[:start] + data[end:]
              file.write_text(data, encoding='utf-8')
          PY

      - name: Build installable APK
        run: bash gradlew --no-daemon assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: HazardGuard-World-v3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
