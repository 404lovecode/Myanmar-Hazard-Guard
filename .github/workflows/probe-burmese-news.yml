name: Inspect DVB story cards
on:
  push:
    branches: [burmese-publishers-v8]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Find story dates in public HTML
        run: |
          python3 - <<'PY'
          import urllib.request,re
          s=urllib.request.urlopen(urllib.request.Request("https://burmese.dvb.no/",headers={'User-Agent':'Mozilla/5.0'}),timeout=15).read().decode('utf-8','replace')
          for term in ['href="/post/903793"','href="/post/817119"','"date"','November 3, 2026','publishedAt','"published"','datetime=','2026-11-03','article:published_time']:
              i=s.find(term)
              print("TERM",repr(term),i)
              if i>=0:print("EXCERPT",repr(s[max(0,i-250):i+950]))
          print("POST_LINKS",len(re.findall(r'href="/post/[0-9]+"',s)))
          PY
